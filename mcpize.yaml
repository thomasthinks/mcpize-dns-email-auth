version: 1
runtime: typescript
entry: src/index.ts
description: Live DNS email-authentication diagnostics — SPF (10-lookup chain counting), DMARC, MX/null-MX, RDAP expiry, DNSSEC DS presence, nameserver health. Keyless.

build:
  install: npm ci
  command: npm run build

startCommand:
  type: http
  command: node dist/index.js

configSchema:
  source: code

pricing:
  protocol: x402
  network: base  # production: real USDC on Base mainnet (flipped 2026-10-05)
  recipient: "0x62c6da49028953919a4bd35d3092ac9277DA0a7D"
  asset: usdc
  tools:
    - name: check_spf
      price: "0.02"
    - name: check_dmarc
      price: "0.02"
    - name: check_mx
      price: "0.02"
    - name: domain_health
      price: "0.02"
